name: vikunja

x-daemonless:
  title: "Vikunja"
  icon: ":material-checkbox-marked-outline:"
  category: "Productivity"
  description: "Vikunja is an open-source, self-hostable to-do app. It helps you organize your tasks and projects with features like list, kanban, gantt, and table views - all while keeping your data under your control."
  upstream_url: "https://vikunja.io"
  web_url: "https://vikunja.io"
  freshports_url: "https://www.freshports.org/www/vikunja/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"

  choices:
    database:
      kind: database
      offers: [sqlite, postgres, mariadb, external]
      default: sqlite
      env:
        type: VIKUNJA_DATABASE_TYPE
        host: VIKUNJA_DATABASE_HOST
        user: VIKUNJA_DATABASE_USER
        password: VIKUNJA_DATABASE_PASSWORD
        name: VIKUNJA_DATABASE_DATABASE
      types: { mariadb: mysql }

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      VIKUNJA_DATABASE_TYPE: "sqlite, postgres or mysql -- set by the Database choice"
      VIKUNJA_DATABASE_HOST: "Database host (the PostgreSQL and MariaDB choices fill this in)"
      VIKUNJA_DATABASE_USER: "Database user"
      VIKUNJA_DATABASE_PASSWORD: "Database password"
      VIKUNJA_DATABASE_DATABASE: "Database name"
      VIKUNJA_SERVICE_PUBLICURL:
        desc: "Address you open Vikunja at, e.g. http://192.168.1.10:3456/ (used in links and emails it sends)"
        optional: true
        level: advanced
    volumes:
      /config: "Database (vikunja.db), uploaded files and the login secret"
    ports:
      3456: "Web UI"

services:
  vikunja:
    image: ghcr.io/daemonless/vikunja:latest
    container_name: vikunja
    # "always", not "unless-stopped": FreeBSD's podman rc.d only auto-starts
    # containers with restart-policy=always at boot (needs podman_enable=YES).
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Optional: the address Vikunja puts in the links it sends.
      - VIKUNJA_SERVICE_PUBLICURL=
      # The database, from the Database choice; sqlite needs nothing else.
      - VIKUNJA_DATABASE_TYPE=${VIKUNJA_DATABASE_TYPE:-sqlite}
      - VIKUNJA_DATABASE_HOST=${VIKUNJA_DATABASE_HOST:-}
      - VIKUNJA_DATABASE_USER=${VIKUNJA_DATABASE_USER:-}
      - VIKUNJA_DATABASE_PASSWORD=${VIKUNJA_DATABASE_PASSWORD:-}
      - VIKUNJA_DATABASE_DATABASE=${VIKUNJA_DATABASE_DATABASE:-}

    volumes:
      - /containers/vikunja:/config

    ports:
      - 3456:3456
